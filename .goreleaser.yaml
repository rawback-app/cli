# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: rawback

before:
  hooks:
    - bun run scripts/stage-exiftool.ts
    - bun run scripts/stage-ffmpeg.ts
    # Archive extras are not covered by notarize.macos.ids below.
    - bun run scripts/sign-video-tools.ts --snapshot={{ .IsSnapshot }}
    - bun run scripts/build-windows-arm64.ts

builds:
  - id: rawback
    builder: bun
    binary: rawback
    main: ./src/index.ts
    targets:
      - linux-x64-baseline
      - linux-arm64
      - darwin-x64-baseline
      - darwin-arm64
      - windows-x64-baseline
    flags:
      - --compile
      - --minify
      - --external
      - cpu-features

archives:
  - id: rawback
    ids:
      - rawback
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*
      - src: .release-artifacts/exiftool/{{ .Os }}/**/*
        dst: exiftool
      - src: .release-artifacts/exiftool/{{ .Os }}/exiftool*
        dst: exiftool
      # ffmpeg and ffprobe probe a video, cut its poster frame and split its
      # audio before upload. Unlike exiftool these are per-architecture, so the
      # staging directory nests arch under {{ .Os }}.
      - src: .release-artifacts/ffmpeg/{{ .Os }}/{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}/*
        dst: ffmpeg

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./.release-artifacts/rawback_Windows_arm64.zip

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  github:
    owner: rawback-app
    name: cli
  draft: false
  prerelease: auto
  extra_files:
    - glob: ./.release-artifacts/rawback_Windows_arm64.zip
  mode: replace
  header: |
    ## Rawback CLI {{ .Tag }}

    Install or upgrade on Linux and macOS:

    ```bash
    curl -fsSL https://raw.githubusercontent.com/rawback-app/cli/main/install.sh | sh
    ```

    Install on macOS with Homebrew:

    ```bash
    brew install --cask rawback-app/tap/rawback
    ```
  name_template: 'v{{ .Version }}'

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - rawback
      sign:
        certificate: '{{ .Env.MACOS_SIGN_P12 }}'
        password: '{{ .Env.MACOS_SIGN_PASSWORD }}'
      notarize:
        issuer_id: '{{ .Env.MACOS_NOTARY_ISSUER_ID }}'
        key_id: '{{ .Env.MACOS_NOTARY_KEY_ID }}'
        key: '{{ .Env.MACOS_NOTARY_KEY }}'
        wait: true

homebrew_casks:
  - name: rawback
    ids:
      - rawback
    binaries:
      - rawback
    repository:
      owner: rawback-app
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    directory: Casks
    homepage: 'https://rawback.app'
    description: 'Rawback CLI for managing photo libraries and uploads'
    skip_upload: auto
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    caveats: |
      Authenticate after installation:
        rawback auth

      View available commands with:
        rawback --help
