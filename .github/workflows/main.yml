name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated GraphQL client
        run: bun run graphql:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Build standalone binary
        run: bun run build

      - name: Smoke test standalone binary
        run: |
          ./dist/rawback --help
          test "$(./dist/rawback --version)" = "$(bun -p 'require("./package.json").version')"

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
