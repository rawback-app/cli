name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Build standalone binary
        run: bun run build

      - name: Smoke test standalone binary
        run: |
          ./dist/rawback --help
          test "$(./dist/rawback --version)" = "$(bun -p 'require("./package.json").version')"

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check

  native-smoke:
    name: Native smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-latest
          - name: Linux arm64
            runner: ubuntu-24.04-arm
          - name: macOS x86-64
            runner: macos-15-intel
          - name: macOS arm64
            runner: macos-15
          - name: Windows x86-64
            runner: windows-latest
          - name: Windows arm64
            runner: windows-11-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test platform installer
        run: bun test test/install.test.ts

      - name: Build native standalone binary
        run: bun run build

      - name: Smoke test standalone binary
        if: runner.os != 'Windows'
        run: |
          ./dist/rawback --help
          test "$(./dist/rawback --version)" = "$(bun -p 'require("./package.json").version')"

      - name: Smoke test standalone binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./dist/rawback.exe --help
          $expected = (Get-Content package.json | ConvertFrom-Json).version
          $actual = (./dist/rawback.exe --version).Trim()
          if ($actual -ne $expected) {
            throw "Expected version $expected, got $actual"
          }

  release-snapshot:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean

      - name: Verify release artifacts
        run: |
          test -f dist/rawback_Linux_x86_64.tar.gz
          test -f dist/rawback_Linux_arm64.tar.gz
          test -f dist/rawback_Darwin_x86_64.tar.gz
          test -f dist/rawback_Darwin_arm64.tar.gz
          test -f dist/rawback_Windows_x86_64.zip
          test -f .release-artifacts/rawback_Windows_arm64.zip
          test -f dist/checksums.txt
          cp .release-artifacts/rawback_Windows_arm64.zip dist/
          cd dist
          sha256sum --check checksums.txt
