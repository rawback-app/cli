name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Build standalone binary
        run: bun run build

      - name: Smoke test standalone binary
        run: |
          ./dist/rawback --help
          test "$(./dist/rawback --version)" = "$(bun -p 'require("./package.json").version')"

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check

  native-smoke:
    name: Native smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: blacksmith-2vcpu-ubuntu-2404
            arch: x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            arch: arm64
          - name: macOS x86-64
            runner: macos-15-intel
            arch: x64
          - name: macOS arm64
            runner: macos-15
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify native runner architecture
        run: test "$(bun -p 'process.arch')" = "${{ matrix.arch }}"

      - name: Test platform installer
        run: bun test test/install.test.ts

      - name: Build native standalone binary
        run: bun run build

      - name: Smoke test standalone binary
        run: |
          ./dist/rawback --help
          test "$(./dist/rawback --version)" = "$(bun -p 'require("./package.json").version')"
