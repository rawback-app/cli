query UploadSessions($status: UploadStatus, $pagination: InputPagination!) {
  uploads(status: $status, pagination: $pagination) {
    edges {
      id
      sessionId
      sftpSessionId
      sourceIP
      sourceKind
      status
      closedReason
      clientBanner
      geoCountry
      geoCity
      serverIP
      serverVersion
      serverCommit
      serverHostname
      serverOS
      totalFiles
      processedFiles
      failedFiles
      totalBytes
      processingProgress
      processingImageCount
      processedImageCount
      failedImageCount
      completedAt
      createdAt
      updatedAt
      credential {
        id
        name
      }
    }
    pageInfo {
      page
      pageSize
      totalCount
      totalPages
      hasNextPage
      hasPreviousPage
    }
  }
}
